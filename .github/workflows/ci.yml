name: ci
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege by default; jobs widen scope where needed.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Build
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter creates a check run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Test
        run: gotestsum --junitfile tests.xml -- -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Test report
        uses: dorny/test-reporter@v1
        if: always() # publish results even when tests fail
        with:
          name: Go tests
          path: tests.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  sonarcloud:
    name: SonarCloud
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so SonarCloud can attribute blame
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: .
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
